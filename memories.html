<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الذكريات 🔐</title>

    <link rel="stylesheet" href="Css/style.css">

</head>

<body>

    <main class="home">

        <div class="profile-card">

            <!-- أزرار التنقل -->

            <div class="navigation-buttons">

                <a
                    href="index.html"
                    class="home-button"
                >
                    ⌂ الرئيسية
                </a>

            </div>


            <h1>🔐 Memories </h1>

            <p class="description">
                دخلي الباسورد عشان تشوفي الذكريات ❤️
            </p>


            <!-- خانة الباسورد -->

            <input
                type="password"
                id="password"
                class="password-input"
                placeholder="اكتب الباسورد"
            >


            <!-- زر الدخول -->

            <button
                onclick="checkPassword()"
                class="main-button"
            >
                دخول ❤️
            </button>


            <!-- رسالة الخطأ -->

            <p id="error-message"></p>

        </div>

    </main>


    <script src="JS/main.js"></script>
    <script src="JS/auth.js"></script>

</body>

</html>
